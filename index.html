<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marc's Memory</title>
</head>

<body>
    <main>
        <section class="screen game">
            <header class="header">
                <div class="header__container">
                    <div class="scoreboard">
                        <div class="scoreboard__player scoreboard__player--player1">
                            <svg class="scoreboard__icon" width="24" height="20" viewBox="0 0 24 20" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M2.46154 20C1.78462 20 1.20513 19.7552 0.723077 19.2656C0.241026 18.776 0 18.1875 0 17.5V2.5C0 1.8125 0.241026 1.22396 0.723077 0.734375C1.20513 0.244792 1.78462 0 2.46154 0H16C16.3897 0 16.759 0.0885417 17.1077 0.265625C17.4564 0.442708 17.7436 0.6875 17.9692 1L23.5077 8.5C23.8359 8.9375 24 9.4375 24 10C24 10.5625 23.8359 11.0625 23.5077 11.5L17.9692 19C17.7436 19.3125 17.4564 19.5573 17.1077 19.7344C16.759 19.9115 16.3897 20 16 20H2.46154Z"
                                    fill="currentColor" />
                            </svg>
                            <p>Blue</p>
                            <span class="scoreboard__points scoreboard__points--player1">0</span>
                        </div>
                        <div class="scoreboard__player scoreboard__player--player2">
                            <svg class="scoreboard__icon" width="24" height="20" viewBox="0 0 24 20" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M2.46154 20C1.78462 20 1.20513 19.7552 0.723077 19.2656C0.241026 18.776 0 18.1875 0 17.5V2.5C0 1.8125 0.241026 1.22396 0.723077 0.734375C1.20513 0.244792 1.78462 0 2.46154 0H16C16.3897 0 16.759 0.0885417 17.1077 0.265625C17.4564 0.442708 17.7436 0.6875 17.9692 1L23.5077 8.5C23.8359 8.9375 24 9.4375 24 10C24 10.5625 23.8359 11.0625 23.5077 11.5L17.9692 19C17.7436 19.3125 17.4564 19.5573 17.1077 19.7344C16.759 19.9115 16.3897 20 16 20H2.46154Z"
                                    fill="currentColor" />
                            </svg>
                            <p>Orange</p>
                            <span class="scoreboard__points scoreboard__points--player2">0</span>
                        </div>
                    </div>
                    <div class="header__current-player">
                        <p>Current player:</p>
                        <svg class="header__marker" width="24" height="20" viewBox="0 0 24 20" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M2.46154 20C1.78462 20 1.20513 19.7552 0.723077 19.2656C0.241026 18.776 0 18.1875 0 17.5V2.5C0 1.8125 0.241026 1.22396 0.723077 0.734375C1.20513 0.244792 1.78462 0 2.46154 0H16C16.3897 0 16.759 0.0885417 17.1077 0.265625C17.4564 0.442708 17.7436 0.6875 17.9692 1L23.5077 8.5C23.8359 8.9375 24 9.4375 24 10C24 10.5625 23.8359 11.0625 23.5077 11.5L17.9692 19C17.7436 19.3125 17.4564 19.5573 17.1077 19.7344C16.759 19.9115 16.3897 20 16 20H2.46154Z"
                                fill="currentColor" />
                        </svg>
                    </div>
                    <div class="header__exit">
                        <button type="button" class="button">
                            <svg class="button__icon" width="26" height="23" viewBox="0 0 26 23" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M21.4375 12.5H7.5C7.14583 12.5 6.84896 12.3802 6.60938 12.1406C6.36979 11.901 6.25 11.6042 6.25 11.25C6.25 10.8958 6.36979 10.599 6.60938 10.3594C6.84896 10.1198 7.14583 10 7.5 10H21.4375L20.375 8.9375C20.125 8.6875 20.0052 8.39583 20.0156 8.0625C20.026 7.72917 20.1458 7.4375 20.375 7.1875C20.625 6.9375 20.9219 6.80729 21.2656 6.79688C21.6094 6.78646 21.9062 6.90625 22.1562 7.15625L25.375 10.375C25.625 10.625 25.75 10.9167 25.75 11.25C25.75 11.5833 25.625 11.875 25.375 12.125L22.1562 15.3438C21.9062 15.5938 21.6094 15.7135 21.2656 15.7031C20.9219 15.6927 20.625 15.5625 20.375 15.3125C20.1458 15.0625 20.026 14.7708 20.0156 14.4375C20.0052 14.1042 20.125 13.8125 20.375 13.5625L21.4375 12.5ZM15 6.25V2.5H2.5V20H15V16.25C15 15.8958 15.1198 15.599 15.3594 15.3594C15.599 15.1198 15.8958 15 16.25 15C16.6042 15 16.901 15.1198 17.1406 15.3594C17.3802 15.599 17.5 15.8958 17.5 16.25V20C17.5 20.6875 17.2552 21.276 16.7656 21.7656C16.276 22.2552 15.6875 22.5 15 22.5H2.5C1.8125 22.5 1.22396 22.2552 0.734375 21.7656C0.244792 21.276 0 20.6875 0 20V2.5C0 1.8125 0.244792 1.22396 0.734375 0.734375C1.22396 0.244792 1.8125 0 2.5 0H15C15.6875 0 16.276 0.244792 16.7656 0.734375C17.2552 1.22396 17.5 1.8125 17.5 2.5V6.25C17.5 6.60417 17.3802 6.90104 17.1406 7.14062C16.901 7.38021 16.6042 7.5 16.25 7.5C15.8958 7.5 15.599 7.38021 15.3594 7.14062C15.1198 6.90104 15 6.60417 15 6.25Z"
                                    fill="currentColor" />
                            </svg>
                            Exit Game</button>
                    </div>
                </div>
            </header>
            <section id="field" class="field">

            </section>
        </section>
        <section class="screen game-over is-hidden">
            <h1 class="game-over__title">
                <img class="game-over__image" src="./src/assets/images/game-over-title.svg" alt="Game over">
            </h1>
            <p class="game-over__label">Final score</p>
            <div class="scoreboard">
                <div class="scoreboard__player scoreboard__player--player1">
                    <svg class="scoreboard__icon" width="24" height="20" viewBox="0 0 24 20" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M2.46154 20C1.78462 20 1.20513 19.7552 0.723077 19.2656C0.241026 18.776 0 18.1875 0 17.5V2.5C0 1.8125 0.241026 1.22396 0.723077 0.734375C1.20513 0.244792 1.78462 0 2.46154 0H16C16.3897 0 16.759 0.0885417 17.1077 0.265625C17.4564 0.442708 17.7436 0.6875 17.9692 1L23.5077 8.5C23.8359 8.9375 24 9.4375 24 10C24 10.5625 23.8359 11.0625 23.5077 11.5L17.9692 19C17.7436 19.3125 17.4564 19.5573 17.1077 19.7344C16.759 19.9115 16.3897 20 16 20H2.46154Z"
                            fill="currentColor" />
                    </svg>
                    <p>Blue</p>
                    <span class="scoreboard__points scoreboard__points--player1">0</span>
                </div>
                <div class="scoreboard__player scoreboard__player--player2">
                    <svg class="scoreboard__icon" width="24" height="20" viewBox="0 0 24 20" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M2.46154 20C1.78462 20 1.20513 19.7552 0.723077 19.2656C0.241026 18.776 0 18.1875 0 17.5V2.5C0 1.8125 0.241026 1.22396 0.723077 0.734375C1.20513 0.244792 1.78462 0 2.46154 0H16C16.3897 0 16.759 0.0885417 17.1077 0.265625C17.4564 0.442708 17.7436 0.6875 17.9692 1L23.5077 8.5C23.8359 8.9375 24 9.4375 24 10C24 10.5625 23.8359 11.0625 23.5077 11.5L17.9692 19C17.7436 19.3125 17.4564 19.5573 17.1077 19.7344C16.759 19.9115 16.3897 20 16 20H2.46154Z"
                            fill="currentColor" />
                    </svg>
                    <p>Orange</p>
                    <span class="scoreboard__points scoreboard__points--player2">0</span>
                </div>
            </div>
        </section>
        <section class="screen winner is-hidden">
            <img class="winner__confetti" src="./src/assets/images/confetti.svg" alt="">
            <p class="winner__label">The winner is</p>
            <h1 class="winner__title winner__title--player1">Blue Player</h1>
            <img class="winner__icon" src="./src/assets/images/winner-p1.svg" alt="">
            <button class="button button--secondary" type="button">Back to start</button>
        </section>
        <section class="screen draw is-hidden">
            <p class="draw__label">It's a</p>
            <h1 class="draw__title">
                <img class="draw__img" src="./src/assets/images/draw-title.svg" alt="Draw">
            </h1>
            <img class="draw__icon" src="./src/assets/images/draw.svg" alt="">
            <button class="button button--secondary" type="button">Back to start</button>
        </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
